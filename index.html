/* Full app styles */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --mrp:#3a6b35;--mrp-mid:#4a7c3f;--mrp-light:#eaf3e6;--mrp-pale:#f2f8f0;
  --mrp-border:#c4dbbf;--mrp-dark:#2d5228;
  --color-text-primary:#111;--color-text-secondary:#555;--color-text-tertiary:#999;
  --color-text-danger:#c0392b;--color-text-warning:#d68910;--color-text-success:#1a7a2e;
  --color-text-info:#1a3d7c;
  --color-background-primary:#fff;--color-background-secondary:#f5f5f5;
  --color-background-info:#dce8fd;--color-background-warning:#fff3cd;
  --color-border-tertiary:#e0e0e0;--color-border-secondary:#ccc;--color-border-danger:#e74c3c;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
body{font-family:var(--font-sans);color:var(--color-text-primary);font-size:13px;background:#f0f4ef;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:210px;flex-shrink:0;border-right:0.5px solid var(--mrp-border);display:flex;flex-direction:column;background:var(--mrp-pale);position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:8px 14px;border-bottom:0.5px solid var(--mrp-border);background:var(--mrp);display:flex;align-items:center;justify-content:center;min-height:46px}
.sb-logo img{max-height:42px;max-width:170px;object-fit:contain;filter:brightness(0) invert(1)}
.sb-body{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.sec-label{font-size:10px;color:var(--mrp-mid);text-transform:uppercase;letter-spacing:.08em;padding:10px 8px 3px;font-weight:500}
.nav-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;border:none;background:none;color:var(--mrp-dark);font-size:12px;cursor:pointer;width:100%;text-align:left}
.nav-btn:hover{background:var(--mrp-light)}
.nav-btn.active{background:var(--mrp);color:#fff}
.nav-btn i{font-size:16px}
.sb-footer{padding:10px 8px;border-top:0.5px solid var(--mrp-border);display:flex;flex-direction:column;gap:5px}
.main{flex:1;overflow-y:auto;padding:1.5rem;min-width:0;background:var(--color-background-primary)}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:1rem 1.25rem}
.card-green{background:var(--mrp-pale);border:0.5px solid var(--mrp-border);border-radius:10px;padding:1rem 1.25rem}
.btn-mrp{background:var(--mrp);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-mrp:hover{background:var(--mrp-dark)}
.btn-outline{background:none;color:var(--mrp-dark);border:0.5px solid var(--mrp-border);border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-outline:hover{background:var(--mrp-light)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-danger{background:none;color:var(--color-text-danger);border:0.5px solid var(--color-border-danger);border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer}
.btn-promote{background:var(--mrp-light);color:var(--mrp-dark);border:0.5px solid var(--mrp-border);border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-promote:hover{background:var(--mrp);color:#fff}
.btn-io{background:none;color:var(--mrp-dark);border:0.5px solid var(--mrp-border);border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;width:100%}
.btn-io:hover{background:var(--mrp-light)}
input,select,textarea{width:100%;font-size:12px;padding:6px 9px;border-radius:6px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mrp-mid)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
h1{font-size:19px;font-weight:500}
h2{font-size:16px;font-weight:500}
h3{font-size:14px;font-weight:500}
.fg{display:flex;flex-direction:column;gap:4px}
.fr{display:flex;gap:8px}
label{font-size:11px;color:var(--color-text-secondary)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10px;font-weight:500;color:var(--mrp-mid);padding:5px 8px;border-bottom:0.5px solid var(--mrp-border);background:var(--mrp-pale)}
.tbl td{padding:6px 8px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.row-click{cursor:pointer}
.tbl tr.row-click:hover td{background:var(--mrp-pale)}
.badge{font-size:10px;padding:2px 6px;border-radius:5px}
.b-active{background:#d4edda;color:#1a5c2a}
.b-dev{background:#fff3cd;color:#7a5000}
.b-rd{background:#dce8fd;color:#1a3d7c}
.b-gray{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.b-info{background:var(--color-background-info);color:var(--color-text-info)}
.metric{background:var(--mrp-pale);border:0.5px solid var(--mrp-border);border-radius:8px;padding:10px 12px}
.metric-val{font-size:18px;font-weight:500;color:var(--mrp-dark)}
.metric-lbl{font-size:10px;color:var(--mrp-mid);margin-top:2px}
.pct-bar-wrap{width:50px;height:5px;background:var(--color-background-secondary);border-radius:3px;display:inline-block;vertical-align:middle;margin-right:5px}
.pct-bar{height:5px;border-radius:3px;background:var(--mrp)}
.empty{text-align:center;padding:2.5rem;color:var(--color-text-tertiary)}
.empty i{font-size:32px;display:block;margin-bottom:8px}
.ver-card{border:0.5px solid var(--mrp-border);border-radius:10px;overflow:hidden}
.ver-header{background:var(--mrp);color:#fff;padding:5px 10px;display:flex;align-items:center;justify-content:space-between}
.ver-header.active-ver{background:var(--mrp-dark)}
.ver-body{padding:10px 14px;background:var(--color-background-primary)}
.nut-panel{background:var(--mrp-pale);border:0.5px solid var(--mrp-border);border-radius:8px;padding:10px 14px;margin-top:10px}
.nut-tbl th{background:var(--mrp);color:#fff;font-size:10px;padding:5px 6px;text-align:right}
.nut-tbl th:first-child{text-align:left}
.nut-tbl td{font-size:11px;padding:5px 6px;text-align:right;font-family:var(--font-mono);border-bottom:0.5px solid var(--mrp-border)}
.nut-tbl td:first-child{text-align:left;font-family:var(--font-sans);font-weight:500}
.nut-tbl tr:last-child td{border-bottom:none;font-weight:500;background:var(--mrp-pale);color:var(--mrp-dark)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--mrp-dark);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

#print-area { display: none; }
@media print {
  body > * { display: none !important; }
  body { background: #fff !important; font-size: 11px; margin: 0; }
  #print-area { display: block !important; padding: 15mm; box-sizing: border-box; }
  thead th { -webkit-print-color-adjust: exact; print-color-adjust: exact; background-color: #3a6b35 !important; color: #fff !important; }
  @page { margin: 0; size: A4 portrait; }
}

/* ===== Theme A: Refined Green (screen only) ===== */
@media screen{

.nav-btn:hover{background:rgba(255,255,255,.1)}

.btn-io:hover{background:rgba(255,255,255,.1)}

.ver-header{background:#2E5E41;padding:8px 14px}
.ver-header.active-ver{background:#17432A}
.btn-mrp{background:#17432A;border-radius:8px;font-weight:700;padding:9px 16px;font-size:12.5px}
.btn-mrp:hover{background:#0F3320}
.btn-outline{color:#17432A;border:1.5px solid #17432A;border-radius:8px;font-weight:700;padding:8px 15px;font-size:12.5px}
.btn-outline:hover{background:#E4EDE2}
.btn-outline.btn-sm,.btn-mrp.btn-sm{padding:4px 9px;font-size:11px;font-weight:600;border-width:1px;border-radius:7px}
.btn-promote{background:#E4EDE2;color:#17432A;border:none;border-radius:7px;font-weight:600}
.btn-promote:hover{background:#17432A;color:#fff}
.btn-danger{border-radius:7px;font-weight:600}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;font-weight:800}
h3{font-size:15px;font-weight:700}
input,select,textarea{border:1px solid #D5E0D2;border-radius:8px;padding:7px 10px}
input:focus,select:focus,textarea:focus{border-color:#2E7D4F;box-shadow:0 0 0 3px rgba(46,125,79,.15)}
label{font-weight:600}
.tbl th{background:#E4EDE2;color:#2B4A35;font-size:11px;font-weight:800;letter-spacing:.04em;padding:10px 12px;border-bottom:none}
.tbl td{padding:10px 12px;border-bottom:1px solid #E6ECE4;font-variant-numeric:tabular-nums}
.tbl tr.row-click:hover td{background:#F3F6F1}
.nut-tbl th{background:#17432A}
.nut-tbl td{border-bottom:1px solid #E6ECE4}
.metric-val{font-weight:800;color:#17432A}
.metric-lbl{color:#4D6354;font-weight:600}
.badge{font-weight:700;border-radius:6px}
.toast{background:#17432A}
}

async function exportData(){
  const json=JSON.stringify({exportDate:new Date().toISOString(),version:"mrp_v4",data:DB},null,2);
  const name="MRP_FlavourLab_backup_"+new Date().toISOString().slice(0,10)+".json";
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:"JSON backup",accept:{"application/json":[".json"]}}]});
      const w=await h.createWritable();await w.write(json);await w.close();
      showToast("Backup saved");return;
    }catch(e){
      if(e&&e.name==="AbortError")return;
    }
  }
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast("Backup exported (saved to your Downloads folder)");
}
function handleImport(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const parsed=JSON.parse(e.target.result);
      const data=parsed.data||parsed;
      if(!data.rm||!Array.isArray(data.rm))throw new Error("Invalid file format");
      const dateStr=parsed.exportDate?new Date(parsed.exportDate).toLocaleString():"unknown date";
      if(!confirm("Import backup from "+dateStr+"?\n\nThis will REPLACE all current data. Ensure you have exported a backup first."))return;
      DB=data;
      if(!DB.rdFormulas)DB.rdFormulas=[];
      if(!DB.finalFormulas)DB.finalFormulas=[];
      if(!DB.apps)DB.apps=[];
      if(!DB.specs)DB.specs=[];
      save();
      S={view:"rd",selectedRD:null,selectedFinal:null,editObj:null,search:"",rmSearch:"",rmTypeFilter:"All",aiLoading:false,nutServing:100};
      render();showToast("Data imported successfully");
    }catch(err){alert("Import failed: "+err.message);}
    event.target.value="";
  };
  reader.readAsText(file);
}

// qty-based helpers — R&D components store {rmId, qty} in grams
function totalQty(comps){return(comps||[]).reduce((s,x)=>s+(parseFloat(x.qty)||0),0);}
function compPct(c,total){return total>0?((parseFloat(c.qty)||0)/total*100):0;}
function fmtCostQty(comps){const tot=totalQty(comps);if(tot===0)return 0;let c=0;(comps||[]).forEach(x=>{const r=DB.rm.find(m=>m.id===x.rmId);if(r)c+=compPct(x,tot)/100*r.costPerKg;});return c;}
// pct-based helpers — Final formulas
function fmtCost(comps){let c=0;(comps||[]).forEach(x=>{const r=DB.rm.find(m=>m.id===x.rmId);if(r)c+=(parseFloat(x.pct)||0)/100*r.costPerKg;});return c;}
function fmtPct(comps){return(comps||[]).reduce((s,x)=>s+(parseFloat(x.pct)||0),0);}
function nutOf(rm){return rm?(NUT_DATA[rm.name]||rm.nut||null):null;}
function calcNut(comps,sg){
  const tot=totalQty(comps);
  const usesQty=tot>0&&comps.some(c=>c.qty!=null);
  const o={};NUT_FIELDS.forEach(f=>o[f]=0);
  (comps||[]).forEach(c=>{
    const rm=DB.rm.find(r=>r.id===c.rmId);if(!rm)return;
    const nd=nutOf(rm);if(!nd)return;
    const w=usesQty?compPct(c,tot)/100:(parseFloat(c.pct)||0)/100;
    NUT_FIELDS.forEach(f=>o[f]+=(nd[f]||0)*w*(sg/100));
  });return o;}
function hasNut(comps){return(comps||[]).some(c=>{const rm=DB.rm.find(r=>r.id===c.rmId);return rm&&nutOf(rm);});}
function fmtN(v,d){const r=parseFloat((v||0).toFixed(d||1));return r===0?"0":r.toString();}
function nutPanel(comps,sg,showServing){
  if(!hasNut(comps))return'<div class="nut-panel"><p style="font-size:11px;color:var(--mrp-mid)"><i class="ti ti-info-circle"></i> No nutritional data available for these raw materials.</p></div>';
  const n=calcNut(comps,sg);const p=calcNut(comps,100);
  return'<div class="nut-panel"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px"><h3 style="color:var(--mrp-dark);font-size:13px"><i class="ti ti-nutrition" style="margin-right:5px"></i>Nutritional roll-up</h3>'+(showServing?'<div style="display:flex;align-items:center;gap:6px"><label style="white-space:nowrap;color:var(--mrp-dark);font-weight:500">Per</label><input type="number" min="1" max="1000" step="1" value="'+sg+'" oninput="S.nutServing=parseFloat(this.value)||100;render()" style="width:65px;text-align:center"><label style="white-space:nowrap;color:var(--mrp-dark);font-weight:500">g serving</label></div>':'')+ '</div><div style="overflow-x:auto"><table class="tbl nut-tbl" style="min-width:420px"><thead><tr><th style="text-align:left;min-width:120px">Nutrient</th><th style="text-align:right">Per 100 g</th><th style="text-align:right">Per '+sg+' g</th><th style="text-align:right;width:45px">Unit</th></tr></thead><tbody>'+NUT_FIELDS.map((f,i)=>'<tr><td>'+NUT_LABELS[i]+'</td><td>'+fmtN(p[f],f==="sodium"?0:2)+'</td><td>'+fmtN(n[f],f==="sodium"?0:2)+'</td><td style="color:var(--mrp-mid)">'+NUT_SHORT[i]+'</td></tr>').join("")+'</tbody></table></div><p style="font-size:10px;color:var(--mrp-mid);margin-top:6px">Weighted average from RM data. Materials without data contribute 0. Estimates only.</p></div>';
}

}

gth+')</button><div class="sec-label">Ideas</div><button class="nav-btn '+(S.view==="ideas"||S.view==="editNote"||(S.fromIdeas&&(S.view==="rd"||S.view==="editRD"||S.view==="editVer"))?"active":"")+'" onclick="sv('+"'ideas'"+ ')"><i class="ti ti-bulb"></i> Ideas &amp; Notes ('+((DB.notes||[]).length+DB.rdFormulas.filter(f=>f.idea).length)+')</button></div><div class="sb-footer"><button class="btn-io" onclick="S.showCosts=!S.showCosts;render()">'+(S.showCosts?'<i class="ti ti-eye-off" style="font-size:15px"></i> Hide costs':'<i class="ti ti-eye" style="font-size:15px"></i> Show costs')+'</button><button class="btn-io" onclick="S.showCommercial=!S.showCommercial;render()">'+(S.showCommercial?'<i class="ti ti-eye-off" style="font-size:15px"></i> Hide commercial':'<i class="ti ti-eye" style="font-size:15px"></i> Show commercial')+'</button><div class="sec-label" style="padding:0 0 5px">Data backup</div><button class="btn-io" onclick="exportData()"><i class="ti ti-download" style="font-size:15px"></i> Export backup (.json)</button><button class="btn-io" onclick="document.getElementById('+"'import-file'"+ ').click()"><i class="ti ti-upload" style="font-size:15px"></i> Import backup (.json)</button></div>';

function sv(v){S.fromIdeas=false;const sc=S.showCosts;const scom=S.showCommercial;S.view=v;S.selectedRD=null;S.selectedFinal=null;S.editObj=null;S.showCosts=sc;S.showCommercial=scom;S.specFormulaId=null;S.specVersionId=null;S.specIsRD=false;render();}

function renderRDList(){
  const filt=DB.rdFormulas.filter(f=>!f.idea).filter(f=>!S.search||f.name.toLowerCase().includes(S.search.toLowerCase())||f.code.toLowerCase().includes(S.search.toLowerCase()));
  return'<div class="ph"><h1>Recipes</h1><button class="btn-mrp" onclick="newRD()"><i class="ti ti-plus"></i> New Project</button></div><input type="text" placeholder="Search\u2026" value="'+S.search+'" oninput="S.search=this.value;render()" style="max-width:240px;margin-bottom:1rem">'+(filt.length===0?'<div class="empty"><i class="ti ti-flask-2"></i><p>No recipes yet.</p></div>'  :'<div class="card" style="padding:0;overflow:hidden"><table class="tbl" style="table-layout:auto"><thead><tr><th>Code</th><th>Project name</th><th>Status</th><th style="text-align:center">Versions</th><th style="text-align:center">Active version</th><th style="text-align:right">Active cost/kg</th></tr></thead><tbody>'+filt.map(f=>{const av=f.versions?.find(v=>v.active)||f.versions?.[0];return'<tr class="row-click" onclick="selectRD('+f.id+')"><td><span style="font-family:var(--font-mono);font-size:11px">'+f.code+'</span></td><td style="font-weight:500">'+f.name+'</td><td><span class="badge b-rd">'+f.status+'</span></td><td style="text-align:center">'+(f.versions?.length||0)+'</td><td style="text-align:center">'+(av?escH(av.label):"\u2014")+'</td><td style="text-align:right;font-weight:500">R '+(av?fmtCostQty(av.components).toFixed(2):"\u2014")+'</td></tr>';}).join("")+'</tbody></table></div>');
}

function selectRD(id){S.selectedRD=id;render();}
function selectFinal(id){S.selectedFinal=id;render();}

function renderRDDetail(){
  const f=DB.rdFormulas.find(x=>x.id===S.selectedRD);if(!f)return"";
  const vers=f.versions||[];
  const actions='<div style="display:flex;gap:8px;margin-bottom:1.1rem;flex-wrap:wrap"><button class="btn-outline" onclick="S.selectedRD=null;render()"><i class="ti ti-arrow-left"></i> Back</button><button class="btn-outline" onclick="editRD('+f.id+')"><i class="ti ti-edit"></i> Edit</button><button class="btn-mrp" onclick="newVersion('+f.id+')"><i class="ti ti-plus"></i> Add version</button><button class="btn-outline" onclick="printFormula()"><i class="ti ti-printer"></i> Print / PDF</button><button class="btn-danger" onclick="deleteRD('+f.id+')">Delete project</button></div>';
  const title='<div style="margin-bottom:1.1rem"><div style="display:flex;align-items:center;gap:8px;margin-bottom:3px"><h1>'+f.name+'</h1><span class="badge b-rd">'+f.status+'</span></div><div style="font-size:11px;color:var(--mrp-mid)"><span style="font-family:var(--font-mono)">'+f.code+'</span>'+(f.notes?' \u00b7 '+f.notes:"")+'</div></div>';
  if(vers.length===0)return'<div>'+actions+title+'<div class="empty" style="border:0.5px solid var(--mrp-border);border-radius:10px"><i class="ti ti-versions"></i><p>No versions yet.</p></div></div>';
  return'<div>'+actions+title+renderVersionsTable(f,vers)+'</div>';
}

function renderVersionsTable(f,vers){
  const rmOrder=[];const rmSeen=new Set();
  vers.forEach(v=>(v.components||[]).forEach(c=>{if(c.rmId&&!rmSeen.has(c.rmId)){rmSeen.add(c.rmId);rmOrder.push(c.rmId);}}));

  // cols per version: qty, pct, batch [, extR if showCosts]
  const vCols=S.showCosts?4:3;
  // total fixed cols: RM name [, R/kg if showCosts]
  const fixedCols=S.showCosts?2:1;

  // Version header row
  const verHdrCells=vers.map(v=>{
    const btnStyle='background:rgba(255,255,255,.15);color:#fff;border:0.5px solid rgba(255,255,255,.3);border-radius:5px;cursor:pointer;font-size:10px;padding:3px 7px';
    const btns=(!v.active?'<button style="'+btnStyle+'" onclick="setActiveVer('+f.id+','+v.id+')">Set active</button> ':'')+
      '<button style="'+btnStyle+'" onclick="editVersion('+f.id+','+v.id+')">Edit</button> '+
      '<button style="'+btnStyle+'" onclick="deleteVersion('+f.id+','+v.id+')">Del</button>';
    return'<th colspan="'+vCols+'" style="background:'+(v.active?'var(--mrp-dark)':'var(--mrp)')+';color:#fff;text-align:center;padding:4px 8px;border-left:2px solid rgba(255,255,255,.2)"><div style="display:flex;align-items:center;justify-content:space-between;gap:6px"><span style="font-weight:500">'+v.label+(v.active?' <span style="font-size:10px;background:#fff;color:#17432A;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:700">ACTIVE</span>':'')+'</span><div style="display:flex;gap:4px;align-items:center">'+btns+'</div></div><div style="font-size:10px;opacity:.7;margin-top:1px">'+(v.date||"")+(v.notes?' &middot; '+v.notes:"")+'</div></th>';
  }).join("");

  // Sub-header row
  const subHdr=vers.map(()=>'<th style="text-align:center;border-left:1px solid var(--mrp-border)">Qty (g)</th><th style="text-align:center">Qty (%)</th><th style="text-align:center">Batch (g)</th>'+(S.showCosts?'<th style="text-align:center">Ext R/kg</th>':'')).join("");

  // Data rows
  const dataRows=rmOrder.map(rmId=>{
    const rm=DB.rm.find(r=>r.id===rmId);if(!rm)return"";
    const verCells=vers.map(v=>{
      const comps=v.components||[];const tot=totalQty(comps);const batch=parseFloat(v.batchKg)||1;
      const comp=comps.find(x=>x.rmId===rmId);
      const qty=comp?parseFloat(comp.qty)||0:0;
      const pct=tot>0?qty/tot*100:0;
      const batchQty=tot>0?qty/tot*batch:0;
      const extR=pct/100*rm.costPerKg;
      const dim=qty===0?'color:var(--color-text-tertiary)':"";
      return'<td style="text-align:center;font-family:var(--font-mono);border-left:1px solid var(--mrp-border);'+dim+'">'+qty.toFixed(3)+'</td>'
            +'<td style="text-align:center;font-family:var(--font-mono);'+dim+'">'+pct.toFixed(3)+'</td>'
            +'<td style="text-align:center;font-family:var(--font-mono);'+dim+'">'+batchQty.toFixed(3)+'</td>'
            +(S.showCosts?'<td style="text-align:center;font-family:var(--font-mono);'+dim+'">R '+extR.toFixed(2)+'</td>':'');
    }).join("");
    return'<tr><td style="white-space:normal;font-weight:500">'+rm.name+'</td>'
          +(S.showCosts?'<td style="text-align:center;font-family:var(--font-mono);color:var(--color-text-secondary)">R '+rm.costPerKg.toFixed(2)+'</td>':'')
          +verCells+'</tr>';
  }).join("");

  // Totals row
  const totCells=vers.map(v=>{
    const comps=v.components||[];const tot=totalQty(comps);const batch=parseFloat(v.batchKg)||1;
    const extTot=comps.reduce((s,comp)=>{const rm=DB.rm.find(r=>r.id===comp.rmId);if(!rm)return s;return s+(tot>0?(parseFloat(comp.qty)||0)/tot*rm.costPerKg:0);},0);
    return'<td style="text-align:center;font-family:var(--font-mono);font-weight:500;border-left:1px solid var(--mrp-border)">'+tot.toFixed(3)+'</td>'
          +'<td style="text-align:center;font-family:var(--font-mono);font-weight:500">100.000</td>'
          +'<td style="text-align:center;font-family:var(--font-mono);font-weight:500">'+batch.toFixed(3)+'</td>'
          +(S.showCosts?'<td style="text-align:center;font-family:var(--font-mono);font-weight:500">R '+extTot.toFixed(2)+'</td>':'');
  }).join("");

  // Promote buttons footer
  const promoteRow=vers.map(v=>'<td colspan="'+vCols+'" style="text-align:center;border-left:1px solid var(--mrp-border);padding:6px"><button class="btn-promote" onclick="openSpec('+f.id+','+v.id+')"><i class="ti ti-file-description"></i> Spec sheet</button> <button class="btn-promote" onclick="makeRM('+f.id+','+v.id+')"><i class="ti ti-flask"></i> Make RM</button></td>').join("");

  const tbl='<div style="overflow-x:auto"><table class="tbl" style="font-size:11px"><thead>'
    +'<tr><th rowspan="2">Raw material</th>'+(S.showCosts?'<th rowspan="2" style="text-align:center;white-space:nowrap">R/kg</th>':'')+verHdrCells+'</tr>'
    +'<tr>'+subHdr+'</tr>'
    +'</thead><tbody>'+dataRows
    +'<tr style="background:var(--mrp-pale)"><td style="font-weight:500">Total</td>'+(S.showCosts?'<td></td>':'')+totCells+'</tr>'
    +'<tr style="background:var(--mrp-pale)"><td colspan="'+fixedCols+'"></td>'+promoteRow+'</tr>'
    +'</tbody></table></div>';

  // Side-by-side nutritional panels
  const anyNut=vers.some(v=>hasNut(v.components||[]));
  const nutCols=anyNut?'<div class="no-print" style="display:grid;grid-template-columns:'+vers.map(()=>'1fr').join(' ')+';gap:12px;margin-top:12px">'+vers.map(v=>{
    if(!hasNut(v.components||[]))return'<div class="card-green" style="font-size:11px;color:var(--mrp-mid);padding:8px 12px"><strong>'+v.label+'</strong><br>No nutritional data.</div>';
    const n=calcNut(v.components,100);
    const rows=NUT_FIELDS.map((fi,i)=>'<tr><td style="padding:3px 6px;font-size:11px">'+NUT_LABELS[i]+'</td><td style="text-align:center;font-family:var(--font-mono);font-size:11px;padding:3px 6px">'+fmtN(n[fi],fi==="sodium"?0:2)+'</td></tr>').join("");
    return'<div class="card-green" style="padding:8px 12px"><div style="font-size:11px;font-weight:600;color:var(--mrp-dark);margin-bottom:6px">'+v.label+' — Nutritional roll-up</div><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;font-size:10px;color:var(--mrp-mid);padding:3px 6px;border-bottom:0.5px solid var(--mrp-border)">Nutrient</th><th style="text-align:center;font-size:10px;color:var(--mrp-mid);padding:3px 6px;border-bottom:0.5px solid var(--mrp-border)">Per 100 g</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }).join("")+'</div>':"";

  return'<div class="card" style="padding:0;overflow:hidden">'+tbl+'</div>'+(S.showCommercial?renderCommercialPanels(f,vers):"")+nutCols;
}


function renderCommercialPanels(f,vers){
  const cols=vers.map(()=>'1fr').join(' ');
  const panels=vers.map(v=>{
    const comps=v.components||[];
    const rmCostRaw=fmtCostQty(comps);
    const yld=parseFloat(v.yieldLoss)||0;
    const yieldFactor=yld<100?1/(1-yld/100):1;
    const rmCostAdj=rmCostRaw*yieldFactor;
    const direct=parseFloat(v.directCost)||0;
    const pkg=parseFloat(v.packaging)||0;
    const totalCost=rmCostAdj+direct+pkg;
    const sp=parseFloat(v.sellingPrice)||0;
    const gm=sp>0?((sp-totalCost)/sp*100):null;
    const gmR=sp>0?sp-totalCost:null;
    const gmColor=gm===null?'var(--color-text-secondary)':gm>0?'var(--color-text-success)':'var(--color-text-danger)';

    function inp(field,val,label,step,prefix){
      const displayVal=parseFloat(val)||0;
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--mrp-border)">'
        +'<span style="font-size:11px;color:var(--color-text-secondary)">'+label+'</span>'
        +'<div style="display:flex;align-items:center;gap:3px">'
        +(prefix?'<span style="font-size:11px;font-family:var(--font-mono)">'+prefix+'</span>':'')
        +'<input type="number" min="0" step="'+step+'" value="'+displayVal+'"'
        +' oninput="updateVerCommercial('+f.id+','+v.id+',this.dataset.field,this.value)" data-field="'+field+'"'
        +' style="width:80px;text-align:center;font-family:var(--font-mono);font-size:11px;padding:3px 6px">'
        +'</div>'
        +'</div>';
    }

    function row(label,val,bold,highlight){
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--mrp-border)'+(bold?';font-weight:500':'')+'">'
        +'<span style="font-size:11px;color:'+(highlight?'var(--mrp-dark)':'var(--color-text-secondary)')+'">'+label+'</span>'
        +'<span style="font-size:11px;font-family:var(--font-mono);text-align:center;min-width:90px;display:inline-block;color:'+(highlight?'var(--mrp-dark)':'var(--color-text-primary)')+'">'+val+'</span>'
        +'</div>';
    }

    return '<div class="card-green" style="padding:10px 12px">'
      +'<div style="font-size:11px;font-weight:600;color:var(--mrp-dark);margin-bottom:6px">'+v.label+' — Commercial</div>'
      +inp('yieldLoss',   v.yieldLoss||0,   'Yield loss (%)',     '1',   '')
      +row('RM cost (unadj.)', 'R '+rmCostRaw.toFixed(2))
      +row('Yield factor',     yieldFactor.toFixed(4)+'×')
      +row('RM cost (adj.)',   'R '+rmCostAdj.toFixed(2))
      +inp('directCost',  v.directCost||0,  'Direct cost (R/kg)', '0.50','R')
      +inp('packaging',   v.packaging||0,   'Packaging (R/kg)',   '0.50','R')
      +'<div style="margin:4px 0;border-top:1px solid var(--mrp-border)"></div>'
      +row('Total product cost','R '+totalCost.toFixed(2),true,true)
      +inp('sellingPrice',v.sellingPrice||0,'Selling price (R/kg)','1',  'R')
      +'<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-weight:500">'
      +'<span style="font-size:11px;color:'+gmColor+'">Gross margin</span>'
      +'<span style="font-size:11px;font-family:var(--font-mono);color:'+gmColor+'">'
      +(gm!==null?'R '+gmR.toFixed(2)+'  ·  '+gm.toFixed(1)+'%':'Enter selling price')
      +'</span>'
      +'</div>'
      +'</div>';
  }).join('');
  return '<div data-commercial-grid="'+f.id+'" style="display:grid;grid-template-columns:'+cols+';gap:12px;margin-top:12px">'+panels+'</div>';
}


function updateVerCommercial(fId,vId,field,val){
  const f=DB.rdFormulas.find(x=>x.id===fId);if(!f)return;
  const v=f.versions.find(x=>x.id===vId);if(!v)return;
  v[field]=parseFloat(val)||0;
  save();
  // Targeted re-render of just the commercial grid
  const grid=document.querySelector('[data-commercial-grid="'+fId+'"]');
  if(grid){
    const tmp=document.createElement('div');
    tmp.innerHTML=renderCommercialPanels(f,f.versions||[]);
    const ng=tmp.firstChild;
    const oe=grid.querySelectorAll('*'),ne=ng.querySelectorAll('*');
    if(oe.length===ne.length){
      // patch in place so the field being typed in keeps focus and its caret
      oe.forEach((o,k)=>{
        const n=ne[k];
        if(o.tagName==='INPUT'){if(o!==document.activeElement)o.value=n.value;return;}
        if(o.getAttribute('style')!==n.getAttribute('style')){if(n.getAttribute('style')===null)o.removeAttribute('style');else o.setAttribute('style',n.getAttribute('style'));}
        if(!o.children.length&&o.textContent!==n.textContent)o.textContent=n.textContent;
      });
    }else grid.replaceWith(ng);
  }
}

function makeRM(fId,vId){
  const isRD=vId!=null;
  const f=isRD?DB.rdFormulas.find(x=>x.id===fId):DB.finalFormulas.find(x=>x.id===fId);
  if(!f)return;
  const v=isRD?(f.versions||[]).find(x=>x.id===vId):f;
  if(!v)return;
  const comps=v.components||[];
  let cost,yf=1;
  if(isRD){
    const yld=parseFloat(v.yieldLoss)||0;yf=yld<100?1/(1-yld/100):1;
    cost=fmtCostQty(comps)*yf+(parseFloat(v.directCost)||0)+(parseFloat(v.packaging)||0);
  }else cost=fmtCost(comps);
  const name=prompt("Name for the new raw material:",f.name);
  if(!name||!name.trim())return;
  const nm=name.trim();
  const nut=hasNut(comps)?calcNut(comps,100):null;
  if(nut&&yf!==1)Object.keys(nut).forEach(k=>nut[k]=nut[k]*yf);
  const costR=Math.round(cost*100)/100;
  let rm=DB.rm.find(r=>r.name.toLowerCase()===nm.toLowerCase());
  if(rm){
    if(!confirm('A raw material named "'+rm.name+'" already exists. Update its cost and nutritional values?'))return;
  }else{
    rm={id:Math.max(0,...DB.rm.map(r=>r.id))+1,name:nm,type:"Flavour base",supplier:"MRP (in-house)",notes:""};
    DB.rm.push(rm);
  }
  rm.costPerKg=costR;
  rm.notes="Made from recipe: "+f.name+(isRD?" "+(v.label||""):"");
  if(nut)rm.nut=nut;else delete rm.nut;
  save();
  showToast('"'+rm.name+'" saved as a raw material (R'+costR.toFixed(2)+'/kg'+(nut?'':', no nutritional data')+')');
}

   +'<h2 style="margin:0 0 8px">Recipe ideas</h2>'+ideaCards+'<h2 style="margin:1.4rem 0 8px">Notes</h2>'+noteCards;
}
function newNote(){S.fromIdeas=false;S.editObj={title:"",text:""};S.view="editNote";render();}
function editNote(id){S.editObj=JSON.parse(JSON.stringify(DB.notes.find(n=>n.id===id)));S.view="editNote";render();}
function renderNoteForm(){
  const n=S.editObj||{title:"",text:""};
  return'<div style="max-width:720px"><div class="ph"><h1>'+(n.id?"Edit note":"New note")+'</h1><div style="display:flex;gap:8px"><button class="btn-outline" onclick="S.editObj=null;S.view='+"'ideas'"+';render()">Cancel</button><button class="btn-mrp" onclick="saveNote()">Save</button></div></div><div class="card"><div style="margin-bottom:12px"><label>Title</label><input type="text" id="n-title" value="'+escH(n.title)+'"></div><div><label>Notes</label><textarea id="n-text" rows="16" style="width:100%;box-sizing:border-box">'+escH(n.text)+'</textarea></div></div></div>';
}
function saveNote(){
  const n=S.editObj;n.title=document.getElementById("n-title").value.trim();n.text=document.getElementById("n-text").value;
  if(!n.title&&!n.text.trim()){alert("Please enter a title or some text.");return;}
  const today=new Date().toISOString().slice(0,10);
  n.date=today;n.updated=Date.now();
  if(!DB.notes)DB.notes=[];
  if(n.id){DB.notes=DB.notes.map(x=>x.id===n.id?n:x);}else{n.id=Date.now();DB.notes.push(n);}
  save();S.editObj=null;S.view="ideas";render();
}
function deleteNote(id){if(!confirm("Delete this note?"))return;DB.notes=DB.notes.filter(n=>n.id!==id);save();render();}
function openIdea(id){S.fromIdeas=true;S.view="rd";S.selectedRD=id;render();}
function newIdeaRecipe(){S.fromIdeas=true;S.selectedRD=null;S.editObj={code:genRDCode(),name:"",status:"Development",notes:"",versions:[],idea:true};S.view="editRD";render();}
function moveIdeaToRD(id){
  const f=DB.rdFormulas.find(x=>x.id===id);if(!f)return;
  if(!confirm('Move "'+f.name+'" to Recipes?'))return;
  delete f.idea;save();showToast("Moved to Recipes");render();
}
function cloneRM(r){
  const base=r.name+" (copy)";let nm=base,k=2;
  while(DB.rm.some(x=>x.name.toLowerCase()===nm.toLowerCase()))nm=base+" "+(k++);
  const c={id:Date.now()+Math.floor(Math.random()*1000),name:nm,type:r.type,supplier:r.supplier||"",costPerKg:r.costPerKg,notes:r.notes||""};
  if(r.docs&&r.docs.length)c.docs=JSON.parse(JSON.stringify(r.docs));
  const nd=nutOf(r);if(nd)c.nut=JSON.parse(JSON.stringify(nd));
  DB.rm.push(c);return c;
}
function duplicateRM(id){const r=DB.rm.find(x=>x.id===id);if(!r)return;const c=cloneRM(r);save();render();showToast('Created "'+c.name+'"');}
function newRM(){S.editObj={name:"",type:"Other",supplier:"",costPerKg:"",notes:""};S.view="editRM";render();}
function editRM(id){S.editObj=JSON.parse(JSON.stringify(DB.rm.find(r=>r.id===id)));S.view="editRM";render();}
function deleteRM(id){const used=[...DB.rdFormulas.flatMap(f=>f.versions||[]),...DB.finalFormulas].some(f=>(f.components||[]).some(c=>c.rmId===id));if(used&&!confirm("This RM is used in formulas. Delete anyway?"))return;DB.rm=DB.rm.filter(r=>r.id!==id);save();render();}

// ===== Raw material documents (links) =====
function safeUrl(u){u=String(u||'').trim();if(!u)return'';if(/^(javascript|data|vbscript):/i.test(u))return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return /^https?:/i.test(u)?u:'';}
function rmDocsCard(r){
  const docs=r.docs||[];
  const rows=docs.map((d,i)=>'<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input id="rm-doc-name-'+i+'" value="'+escH(d.name)+'" placeholder="Document name (e.g. Spec sheet)" style="flex:1;min-width:0"><input id="rm-doc-url-'+i+'" value="'+escH(d.url)+'" placeholder="Link (https://...)" style="flex:2;min-width:0"><button class="btn-danger btn-sm" onclick="removeRMDoc('+i+')">Del</button></div>').join('');
  return'<div class="card" style="margin-bottom:1rem"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="margin:0">Spec sheets &amp; documents</h3><button class="btn-outline btn-sm" onclick="addRMDoc()"><i class="ti ti-plus"></i> Add link</button></div>'+(docs.length?rows:'<p style="font-size:11px;color:var(--color-text-secondary);margin:0">No documents yet. Add a link to a spec sheet stored in OneDrive, SharePoint, Google Drive or a website.</p>')+'</div>';
}
function rmSyncForm(){
  const g=id=>document.getElementById(id);const r=S.editObj;if(!r)return;
  if(g("rm-name")){r.name=g("rm-name").value;r.type=g("rm-type").value;r.supplier=g("rm-supplier").value;r.costPerKg=g("rm-cost").value;r.notes=g("rm-notes").value;}
  r.docs=(r.docs||[]).map((d,i)=>({name:g("rm-doc-name-"+i)?g("rm-doc-name-"+i).value:d.name,url:g("rm-doc-url-"+i)?g("rm-doc-url-"+i).value:d.url}));
}
function addRMDoc(){rmSyncForm();S.editObj.docs=S.editObj.docs||[];S.editObj.docs.push({name:"",url:""});render();}
function removeRMDoc(i){rmSyncForm();S.editObj.docs.splice(i,1);render();}
function rmDocLinks(r){
  return(r.docs||[]).map(d=>{const u=safeUrl(d.url);return u?'<a href="'+escH(u)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--mrp-mid);text-decoration:underline">'+escH(d.name||'Document')+'</a>':'';}).filter(Boolean).join(' &middot; ');
}
function saveRM(){
  const g=id=>document.getElementById(id);const r=S.editObj;
  r.name=g("rm-name").value;r.type=g("rm-type").value;r.supplier=g("rm-supplier").value;r.notes=g("rm-notes").value;
  rmSyncForm();r.costPerKg=parseFloat(r.costPerKg)||0;
  const bad=(r.docs||[]).find(d=>d.url.trim()&&!safeUrl(d.url));
  if(bad){alert("One of the document links isn't a valid web address.");return;}
  r.docs=(r.docs||[]).filter(d=>d.url.trim()).map(d=>({name:d.name.trim()||"Spec sheet",url:safeUrl(d.url)}));
  if(!r.name.trim()){alert("Please enter a name.");return;}
  if(r.id){DB.rm=DB.rm.map(x=>x.id===r.id?r:x);}else{r.id=Date.now();DB.rm.push(r);}
  save();S.editObj=null;S.view="rm";render();
}

function printFormula(){
  const f=DB.rdFormulas.find(x=>x.id===S.selectedRD);
  if(!f)return;
  const pa=document.getElementById('print-area');
  if(!pa)return;
  const vers=f.versions||[];

  // Build print-only table: RM name + one Batch(g) col per version
  const rmOrder=[];const rmSeen=new Set();
  vers.forEach(v=>(v.components||[]).forEach(c=>{if(c.rmId&&!rmSeen.has(c.rmId)){rmSeen.add(c.rmId);rmOrder.push(c.rmId);}}));

  const verHdrs=vers.map(v=>'<th style="text-align:right;text-align:center;background:#fff;color:#333;padding:5px 8px;border:0.5px solid #ccc;font-weight:600">'+v.label+'<br><span style="font-size:9px;opacity:.8;font-weight:normal">Batch (g) &middot; '+(v.batchKg||1)+' g</span></th>').join("");
  const dataRows=rmOrder.map(rmId=>{
    const rm=DB.rm.find(r=>r.id===rmId);if(!rm)return"";
    const cells=vers.map(v=>{
      const comps=v.components||[];const tot=totalQty(comps);const batch=parseFloat(v.batchKg)||1;
      const comp=comps.find(x=>x.rmId===rmId);
      const qty=comp?parseFloat(comp.qty)||0:0;
      const batchQty=tot>0?qty/tot*batch:0;
      const dim=qty===0?'color:#bbb':'';
      return'<td style="text-align:center;font-family:monospace;font-size:11px;border:0.5px solid #ccc;'+dim+'">'+batchQty.toFixed(3)+'</td>';
    }).join("");
    return'<tr><td style="font-weight:500;font-size:11px;padding:4px 8px;border:0.5px solid #ccc">'+rm.name+'</td>'+cells+'</tr>';
  }).join("");
  const totRow=vers.map(v=>{
    const comps=v.components||[];const batch=parseFloat(v.batchKg)||1;
    return'<td style="text-align:center;font-family:monospace;font-size:11px;font-weight:600;border:0.5px solid #ccc">'+batch.toFixed(3)+'</td>';
  }).join("");

  pa.innerHTML='<div style="font-family:sans-serif;font-size:11px">'
    +'<h2 style="margin-bottom:2px;font-size:14px">'+f.name+' <span style="font-size:11px;color:#777;font-family:monospace">'+f.code+'</span></h2>'
    +'<p style="font-size:10px;color:#888;margin-bottom:10px">'+new Date().toLocaleDateString('en-ZA')+'</p>'
    +'<table style="width:100%;border-collapse:collapse;font-size:11px">'
    +'<thead><tr style=""><th style="text-align:left;background:#fff;color:#333;padding:5px 8px;border:0.5px solid #ccc;font-weight:600">Raw material</th>'+verHdrs+'</tr></thead>'
    +'<tbody>'+dataRows+'</tbody>'
    +'<tfoot><tr style="background:#fff"><td style="font-weight:600;font-size:11px;padding:4px 8px;border:0.5px solid #ccc">Total</td>'+totRow+'</tr></tfoot>'
    +'</table></div>';

  pa.style.display='block';
  window.addEventListener('afterprint', function clearPrint(){
    pa.innerHTML='';
    pa.style.display='none';
    window.removeEventListener('afterprint', clearPrint);
  });
  window.print();
}

const QP_DEFS=[['taste','Taste (0.2% in water)'],['colour','Colour'],['appearance','Appearance'],['ph','pH'],['salt','Salt (based on chloride)']];
function qpLabel(d,sp){return d[0]==='taste'&&sp&&sp.template==='powder'?'Taste (1% in water)':d[1];}
function qpOf(sp){
  if(sp.qp)return sp.qp;
  return {taste:{on:false,val:''},colour:{on:false,val:''},appearance:{on:!!sp.tasteAppearance,val:sp.tasteAppearance||''},ph:{on:!!sp.ph&&sp.ph!=='N/A',val:sp.ph&&sp.ph!=='N/A'?sp.ph:''},salt:{on:false,val:''}};
}
function qpList(sp){
  if(!sp.qp){const l=[];if(sp.tasteAppearance)l.push(['Taste & Appearance',sp.tasteAppearance]);if(sp.ph)l.push(['pH',sp.ph]);return l;}
  return QP_DEFS.filter(d=>sp.qp[d[0]]&&sp.qp[d[0]].on).map(d=>[qpLabel(d,sp),sp.qp[d[0]].val||'']);
}
function getSpec(formulaId,versionId){
  if(!DB.specs)DB.specs=[];
  if(versionId!=null)return DB.specs.find(s=>s.formulaId===formulaId&&s.versionId===versionId);
  return DB.specs.find(s=>s.formulaId===formulaId&&!s.versionId);
}

function openSpec(formulaId,versionId){
  S.specFormulaId=formulaId;
  S.specVersionId=(versionId!=null)?versionId:null;
  S.specIsRD=(versionId!=null);
  const existing=getSpec(formulaId,S.specVersionId);
  S.editObj=null;
  S.view=existing?'spec':'editSpec';
  render();
}

function getSpecFormula(){
  if(S.specIsRD){
    const f=DB.rdFormulas.find(x=>x.id===S.specFormulaId);
    const v=f?f.versions.find(x=>x.id===S.specVersionId):null;
    return{f,v,name:f?f.name:'',code:f?f.code:'',comps:v?v.components||[]:[]};
  }
  const f=DB.finalFormulas.find(x=>x.id===S.specFormulaId);
  return{f,v:null,name:f?f.name:'',code:f?f.code:'',comps:f?f.components||[]:[]};
}

function specCode(name,code,ver){
  const safe=(code||name||'').replace(/[^A-Za-z0-9]/g,'').slice(0,10).toUpperCase();
  return 'SP'+safe;
}

function renderSpecView(){
  const {f,v,name,code,comps}=getSpecFormula();
  if(!f)return'';
  const sp=getSpec(S.specFormulaId,S.specVersionId);
  if(!sp)return'<div class="empty"><p>No spec found.</p></div>';
  const docCode=specCode(name,code,sp.version);
  const hasN=hasNut(comps);
  const nutHtml=hasN?buildNutTable(comps):'<p style="font-size:11px;color:var(--mrp-mid)">No nutritional data available.</p>';
  const backClick=S.specIsRD?
    "S.view='rd';S.selectedRD="+S.specFormulaId+";render()":
    "S.view='final';S.selectedFinal="+S.specFormulaId+";render()";
  return '<div style="max-width:720px"><div style="display:flex;gap:8px;margin-bottom:1.1rem;flex-wrap:wrap"><button class="btn-outline" onclick="'+backClick+'"><i class="ti ti-arrow-left"></i> Back</button><button class="btn-outline" onclick="S.view=\'editSpec\';S.editObj=null;render()"><i class="ti ti-edit"></i> Edit spec</button><button class="btn-mrp" onclick="generateSpecDocx()"><i class="ti ti-download"></i> Download .docx</button></div><div class="card" style="padding:1.2rem;font-family:Raleway,sans-serif;font-weight:300"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;padding-bottom:1rem;border-bottom:2px solid var(--mrp)"><img src="'+SPEC_LOGO_B64+'" style="max-height:50px;max-width:160px;object-fit:contain"><div style="text-align:right;font-size:10px;color:var(--color-text-secondary);line-height:1.6">MRP INGREDIENTS (PTY) LTD<br>1 COLLINS STREET<br>WINDSOR GLEN<br>RANDBURG 2194</div></div><h2 style="text-align:center;font-size:15px;letter-spacing:.05em;margin-bottom:1rem">PRODUCT SPECIFICATION</h2><div style="display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:1rem;font-size:12px"><div><strong>Product Description:</strong> '+name+'</div><div><strong>Product Code:</strong> '+docCode+'</div></div>'+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start"><div>'+specSection('Application',nl2br(sp.application))+specSection('Composition','Recommended label declaration: '+sp.recommendedDeclaration+'<br>Ingredients: '+sp.ingredients)+specSection('Quality Parameters',qpList(sp).map(x=>''+x[0].replace(/&/g,'&amp;')+': '+x[1]+'<br>').join('')+'Shelf-life: '+sp.shelfLife+'<br>Storage Requirements: '+sp.storage+'<br>'+sp.fssc)+specSection('Packaging',sp.packaging)+specSection('Allergens',sp.allergens)+specSection('GM Status',sp.gmStatus)+'</div><div>'+specSection('Suitability',sp.halaal+'<br>'+sp.kosher+'<br>'+sp.vegetarian+'<br>'+sp.vegan)+'<div style="margin:1rem 0">'+nutHtml+'<p style="font-size:10px;margin-top:4px">*Calculated values</p></div>'+specSection('Warranty',(sp.warranty||WARRANTY_TEXT).replace(/\n/g,'<br>'))+'</div></div><div style="margin-top:1.5rem;padding-top:.8rem;border-top:0.5px solid var(--color-border-tertiary);display:flex;justify-content:space-between;font-size:10px;color:var(--color-text-tertiary)"><span>Version: '+sp.version+'</span><span>Date: '+sp.dateCreated+'</span></div></div></div>';
}

function nl2br(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\r?\n/g,'<br>');}
function specSection(title,content){
  return `<div style="margin-bottom:.8rem"><strong style="font-size:12px;font-weight:700">${title}</strong><div style="font-size:11px;margin-top:3px">${content}</div></div>`;
}

function buildNutTable(comps){
  const n=calcNut(comps,100);
  const rows=[
    ['Energy (kJ)',n.energy.toFixed(0)],
    ['Protein (g)',n.protein.toFixed(1)],
    ['Glycaemic Carbohydrate (g)',n.carbGly.toFixed(1)],
    ['of which total sugar (g)',n.sugar.toFixed(1)],
    ['Total fat (g)',n.fatTotal.toFixed(1)],
    ['of which saturated fat (g)',n.fatSat.toFixed(1)],
    ['monounsaturated fat (g)',n.fatMono.toFixed(1)],
    ['polyunsaturated fat (g)',n.fatPoly.toFixed(1)],
    ['Dietary fibre (g)',n.fibre.toFixed(1)],
    ['Total sodium (mg)',n.sodium.toFixed(0)],
  ];
  const bd='border:1px solid #111;';
  return '<table style="width:100%;border-collapse:collapse;font-size:11px">'
    +'<thead><tr><th style="'+bd+'text-align:center;font-weight:400;padding:6px 8px">TYPICAL NUTRITIONAL INFORMATION*</th>'
    +'<th style="'+bd+'text-align:center;font-weight:400;padding:6px 8px;width:30%">Per 100 g</th></tr></thead>'
    +'<tbody><tr><td style="'+bd+'padding:8px"></td><td style="'+bd+'"></td></tr>'+rows.map(([l,v])=>`<tr><td style="${bd}padding:4px 8px">${l}</td><td style="${bd}padding:4px 8px;text-align:center">${v}</td></tr>`).join('')
    +'</tbody></table>';
}

function renderSpecForm(){
  const {f,name}=getSpecFormula();if(!f)return'';
  const existing=getSpec(S.specFormulaId,S.specVersionId);
  // If editing existing, start from it; if new, pick template then load defaults
  if(!S.editObj){
    S.editObj=existing?JSON.parse(JSON.stringify(existing)):null;
  }
  const sp=S.editObj;
  if(sp&&!sp.warranty)sp.warranty=WARRANTY_TEXT;
  if(sp&&!sp.qp)sp.qp=qpOf(sp);
  // Template selector if no spec yet
  if(!sp){
    return `<div style="max-width:480px">
      <div class="ph"><h1>New spec — choose template</h1></div>
      <div style="display:flex;gap:12px;margin-top:1rem">
        <div class="card" style="flex:1;cursor:pointer;text-align:center;padding:1.5rem" onclick="initSpec('paste')">

          <div style="font-size:32px;margin-bottom:8px">🧂</div>
          <h3>Powder</h3>
          <p style="font-size:11px;color:var(--color-text-secondary);margin-top:4px">Bags, N/A pH, powder defaults</p>
        </div>
      </div>
    </div>`;
  }
  const field=(id,label,val,rows)=>
    `<div class="fg" style="margin-bottom:10px">
      <label>${label}</label>
      ${rows?`<textarea id="sf-${id}" style="min-height:${rows*22}px">${val||''}</textarea>`
              :`<input id="sf-${id}" value="${(val||'').replace(/"/g,'&quot;')}">`}
    </div>`;
  return `<div style="max-width:640px">
    <div class="ph">
      <h1>${existing?'Edit':'New'} Spec — ${name}</h1>
      <div style="display:flex;gap:8px">
        <button class="btn-outline" onclick="cancelSpecEdit()">Cancel</button>
        <button class="btn-mrp" onclick="saveSpec()"><i class="ti ti-check"></i> Save</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:1rem">
      <h3 style="margin-bottom:10px">Application</h3>
      ${field('application','Application / product description',sp.application,4)}
    </div>
    <div class="card" style="margin-bottom:1rem">
      <h3 style="margin-bottom:10px">Composition</h3>
      ${field('recommendedDeclaration','Recommended label declaration',sp.recommendedDeclaration)}
      ${field('ingredients','Ingredients',sp.ingredients)}
    </div>
    <div class="card" style="margin-bottom:1rem">
      <h3 style="margin-bottom:10px">Quality Parameters</h3>
      <p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:6px">Tick the parameters that apply to this product.</p>
      ${QP_DEFS.map(d=>'<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><label style="display:flex;align-items:center;gap:6px;width:200px;flex-shrink:0;font-size:12px;color:var(--color-text-primary)"><input type="checkbox" id="sf-qpon-'+d[0]+'" style="width:auto"'+(sp.qp[d[0]]&&sp.qp[d[0]].on?' checked':'')+'>'+qpLabel(d,sp)+'</label><input type="text" id="sf-qpval-'+d[0]+'" value="'+String((sp.qp[d[0]]&&sp.qp[d[0]].val)||'').replace(/"/g,'&quot;')+'" placeholder="Specification"></div>').join('')}
      ${field('shelfLife','Shelf-life',sp.shelfLife)}
      ${field('storage','Storage Requirements',sp.storage)}
      ${field('fssc','FSSC statement',sp.fssc)}
    </div>
    <div class="card" style="margin-bottom:1rem">
      <h3 style="margin-bottom:10px">Packaging</h3>
      ${field('packaging','Packaging description',sp.packaging)}
    </div>
    <div class="card" style="margin-bottom:1rem">
      <h3 style="margin-bottom:10px">Allergens, GM & Suitability</h3>
      ${field('allergens','Allergens',sp.allergens)}
      ${field('gmStatus','GM Status',sp.gmStatus)}
      ${field('halaal','Halaal',sp.halaal)}
      ${field('kosher','Kosher',sp.kosher)}
      ${field('vegetarian','Vegetarian',sp.vegetarian)}
      ${field('vegan','Vegan',sp.vegan)}
    </div>
    <div class="card" style="margin-bottom:1rem">
      <h3 style="margin-bottom:10px">Warranty</h3>
      ${field('warranty','Warranty text',sp.warranty,6)}
    </div>
  </div>`;
}

function initSpec(template){
  const defaults=template==='paste'?SPEC_DEFAULTS_PASTE:SPEC_DEFAULTS_POWDER;
  S.editObj={...JSON.parse(JSON.stringify(defaults)),warranty:WARRANTY_TEXT,formulaId:S.specFormulaId,versionId:S.specVersionId,version:1,dateCreated:new Date().toISOString().slice(0,10)};
  render();
}

function cancelSpecEdit(){
  S.editObj=null;
  const existing=getSpec(S.specFormulaId,S.specVersionId);
  if(existing){S.view='spec';}
  else{S.view=S.specIsRD?'rd':'final';if(S.specIsRD)S.selectedRD=S.specFormulaId;else S.selectedFinal=S.specFormulaId;}
  render();
}

function saveSpec(){
  const g=id=>document.getElementById('sf-'+id);
  const fields=['application','recommendedDeclaration','ingredients','shelfLife','storage','fssc','packaging','allergens','gmStatus','halaal','kosher','vegetarian','vegan','warranty'];
  fields.forEach(id=>{if(g(id))S.editObj[id]=g(id).value;});
  S.editObj.qp=S.editObj.qp||{};
  QP_DEFS.forEach(d=>{S.editObj.qp[d[0]]={on:!!(g('qpon-'+d[0])&&g('qpon-'+d[0]).checked),val:g('qpval-'+d[0])?g('qpval-'+d[0]).value:''};});
  // Version bump if editing existing
  const existing=getSpec(S.specFormulaId,S.specVersionId);
  if(existing){
    S.editObj.version=existing.version+1;
    S.editObj.dateCreated=new Date().toISOString().slice(0,10);
    DB.specs=DB.specs.filter(s=>!(s.formulaId===S.specFormulaId&&s.versionId===S.specVersionId));
  }
  S.editObj.formulaId=S.specFormulaId;S.editObj.versionId=S.specVersionId;
  DB.specs.push(S.editObj);
  const savedVersion=S.editObj.version;
  save();S.editObj=null;S.view='spec';render();
  showToast('Spec saved — version '+S.editObj?.version);
}

    function nutTable(){

      const hdr=new TableRow({children:[cell('TYPICAL NUTRITIONAL INFORMATION*',3400,AlignmentType.CENTER),cell('Per 100 g',1500,AlignmentType.CENTER)]});

      const rows=nutRows.map(([lab,val])=>new TableRow({children:[cell(lab,3400),cell(val,1500,AlignmentType.CENTER)]}));
      return new Table({width:{size:4900,type:WidthType.DXA},columnWidths:[3400,1500],rows:[hdr,blank,...rows]});

    const a=document.createElement('a');
    a.href=url;a.download=docCode+'_v'+sp.version+'.docx';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('\u2713 '+docCode+'.docx downloaded');
  }catch(e){
    console.error(e);
    showToast('Error generating document: '+e.message);
  }
}

// ─── END SPEC SHEET SYSTEM ───────────────────────────────────────────────────

render();
</script>
